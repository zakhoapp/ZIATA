</style></head><body class="zi-v78-page"><main class="zi-v78-wrap"><header class="zi-v78-header"><div><small>ZIATA · MY PROFESSIONAL PROFILE</small><h1>پروفایلێ پیشەیی یێ من</h1><p>پرۆژە و لێژنەیێن خۆ زێدە بکە و دەستکاری بکە</p></div><a href="engineer-profiles.html">↩ پروفایلێن پیشەیی</a></header><div id="message" class="zi-v78-status">چاوەڕێ بکە...</div><section class="editor" id="editor" hidden><h2 id="form-title">زێدەکرنا تۆمارەکا نوی</h2><p class="hint">زانیاریێن تە راستەوخۆ دهێنە نیشاندان؛ ئەڤ تۆمارە خۆ-تۆمارکریە و جودایە ژ تۆمارێن فەرمی یێن لێژنان.</p><form id="profile-form"><div class="fields"><label>جورێ تۆمارێ<select id="entry-type" required><option value="project">پرۆژە</option><option value="committee">لێژنە</option></select></label><label>ناڤێ پرۆژە / لێژنێ<input id="entry-title" required minlength="2" maxlength="250"></label><label>رۆلێ من<input id="entry-role" maxlength="150" placeholder="سەرپەرشت / ئەندام / سەرۆک"></label><label>پرۆژەیا گرێدای (بۆ لێژنێ)<input id="entry-project" maxlength="250"></label><label>بەروارا دەستپێکرنێ<input id="entry-start" type="date"></label><label>بەروارا دوماهیێ<input id="entry-end" type="date"></label><label>رەوش<select id="entry-status"><option value="active">بەردەوامە</option><option value="completed">تەمام بوویە</option><option value="paused">راوەستیایە</option></select></label><label class="wide">تێبینی<textarea id="entry-notes" maxlength="1500" rows="3"></textarea></label></div><div class="actions"><button type="submit" id="save">خەزنکرن</button><button type="button" id="cancel" class="secondary">پاقژکرنا فورمێ</button></div></form></section><section class="editor"><h2>پرۆژە و لێژنەیێن من</h2><div id="entries"></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><script src="ziata-supabase-config.js"></script><script src="ziata-auth.js?v=67"></script><script src="ziata-my-professional-profile.js?v=1" defer></script></body></html>
