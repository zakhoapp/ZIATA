<!doctype html><html lang="ku" dir="rtl"><head><link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin><link rel="manifest" href="/ZIATA/manifest.webmanifest"><meta name="theme-color" content="#0E2A47"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ژبیرکرنا پاسۆردێ | ZIATA</title><link rel="icon" href="favicon.png"><link rel="stylesheet" href="ziata-auth.css?v=33"><link rel="stylesheet" href="ziata-theme.css"><link rel="stylesheet" href="ziata-design.css?v=46"></head><body class="zi-auth-page"><main class="zi-auth-card"><img src="logo.webp" alt="ZIATA"><h1>ژبیرکرنا پاسۆردێ</h1><p>ئیدارا سەربەخۆ یا زاخۆ · کاروبارێن تەکنیکی</p><form id="reset-form"><label>ئیمەیل</label><input name="email" type="email" required><button type="submit">فرێکرنا لینکا گۆڕینا پاسۆردێ</button><div class="zi-msg" role="alert"></div></form><div class="links"><a href="login.html">زڤرین بۆ Login</a></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><script src="ziata-supabase-config.js"></script><script src="ziata-auth.js?v=37"></script><script>document.getElementById('reset-form').onsubmit=async e=>{e.preventDefault();const m=e.target.querySelector('[role=alert]');const {error}=await ziataSB.auth.resetPasswordForEmail(e.target.email.value,{redirectTo:location.origin+'/ZIATA/update-password.html'});m.textContent=error?error.message:'لینکا گۆڕینا پاسۆردێ هاتە فرێکرن، ئەگەر ئیمەیل هەبیت.'}</script><script src="/ZIATA/pwa-register.js" defer></script></body></html>
