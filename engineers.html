<!doctype html><html lang="ku" dir="rtl"><head><link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin><link rel="manifest" href="/ZIATA/manifest.webmanifest"><meta name="theme-color" content="#0E2A47"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>سیستەمێ دەرکەفتنا ئەندازیاران</title><style>
:root{--navy:#102b45;--gold:#caa55b;--bg:#f3f6fa}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Tahoma,Arial,sans-serif;color:#1b3045}header{background:linear-gradient(120deg,#102b45,#164760);color:white;padding:17px 22px;border-bottom:4px solid var(--gold)}header a{color:#fff;text-decoration:none}header h1{font-size:21px;margin:10px 0 0}.wrap{max-width:1100px;margin:22px auto;padding:0 15px}.panel{background:white;border:1px solid #dfe7ef;border-radius:16px;padding:22px;box-shadow:0 10px 35px #14304a0c}.tabs{display:flex;gap:9px;margin-bottom:18px;flex-wrap:wrap}.tabs button{background:white;color:var(--navy);border:1px solid #d8e2ed}.tabs button.active,.primary{background:var(--navy)!important;color:white!important}button{border:0;border-radius:9px;padding:12px 17px;font:inherit;font-weight:bold;cursor:pointer}button:disabled{opacity:.55;cursor:wait}label{display:block;margin:14px 0 6px;font-weight:bold}input,textarea{width:100%;padding:12px;border:1px solid #cad6e0;border-radius:9px;font:inherit;background:white}textarea{min-height:78px}.primary{margin-top:16px;width:100%}.hide{display:none!important}.msg{margin:12px 0;white-space:pre-wrap;color:#9d2c2c}.ok{color:#176e40}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.tablewrap{overflow:auto;margin-top:17px}table{border-collapse:collapse;width:100%;min-width:800px}th{background:var(--navy);color:white}th,td{padding:12px;text-align:right;border-bottom:1px solid #e3e8ef;font-size:13px}small{color:#63758a}.stats{margin:12px 0;color:#244a70}#login{max-width:430px;margin:auto}@media(max-width:750px){.grid{grid-template-columns:1fr 1fr}.panel{padding:15px}}@media(max-width:420px){.grid{grid-template-columns:1fr}}
</style><link rel="stylesheet" href="ziata-theme.css"><link rel="stylesheet" href="ziata-stitch.css?v=31"><link rel="stylesheet" href="ziata-auth.css?v=33"><link rel="stylesheet" href="ziata-v34.css?v=34"><link rel="stylesheet" href="ziata-design.css?v=61"></head><body style="visibility:hidden"><header><a href="index.html">→ داشبۆردا سەرەکی</a><h1>سیستەمێ دەرکەفتن و زڤرینێ (ئەندازیار)</h1><small style="color:#e5d6b6">ئیدارا سەربەخۆ یا زاخۆ · کاروبارێن تەکنیکی</small></header><main class="wrap"><div class="tabs"><button id="tabForm" class="active" onclick="tab('form')">📝 تۆمارکرنا دەرکەفتنێ</button><button id="tabDash" onclick="tab('dashboard')">📊 داشبۆرد</button></div><section id="form" class="panel"><h2>فۆرما دەرکەفتنا ئەندازیاران</h2><form id="departure"><label>ناڤێ ئەندازیاری</label><input name="engineer" list="engineersList" required maxlength="200"><datalist id="engineersList"></datalist><label>ناڤێ شوڤێری</label><input name="driver" list="driversList" required maxlength="200"><datalist id="driversList"></datalist><label>جهـ / پرۆژە</label><input name="project" required maxlength="500"><label>تێبینی</label><textarea name="note" maxlength="2000"></textarea><button class="primary" id="save" type="submit">تۆمارکرنا دەرکەفتنێ</button></form><p class="msg" id="formMsg"></p></section><section id="dashboard" class="panel hide"><div id="login"><h2>چوونا داشبۆردێ</h2><p>پاسووردێ داشبۆردا سیستەمێ ئەسلی بنڤیسە.</p><form id="loginForm"><input id="password" type="password" required autocomplete="off" placeholder="پاسوورد"><button class="primary" id="load" type="submit">تێچوون</button></form></div><div id="dataPanel" class="hide"><h2>راپۆرتا دەرکەفتنان</h2><div class="grid"><input id="engFilter" list="engineersList" placeholder="ئەندازیار"><input id="driverFilter" list="driversList" placeholder="شوڤێر"><input id="monthFilter" type="month"><input id="dateFilter" type="date"></div><button onclick="resetFilters()" style="margin-top:12px">پاقژکرنا فلتەران</button><div class="stats" id="stats"></div><div class="tablewrap"><table><thead><tr><th>بەروار</th><th>دەم</th><th>ئەندازیار</th><th>پرۆژە / جهـ</th><th>شوڤێر</th><th>تێبینی</th></tr></thead><tbody id="rows"></tbody></table></div></div><p class="msg" id="dashMsg"></p></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><script src="ziata-supabase-config.js"></script><script src="ziata-auth.js?v=63"></script>
<script>
const $=id=>document.getElementById(id);let allRows=[];
function tab(which){$('form').classList.toggle('hide',which!=='form');$('dashboard').classList.toggle('hide',which!=='dashboard');$('tabForm').classList.toggle('active',which==='form');$('tabDash').classList.toggle('active',which==='dashboard')}
async function api(body){const response=await window.ziataProxy('engineers',body);let result;try{result=await response.json()}catch{throw Error('Supabase response is not JSON')}if(!response.ok||!result.ok)throw Error(result.error||'Request failed');return result}
async function metadata(){try{let r=await api({action:'metadata'});for(const [key,list] of [['engineersList',r.data.engineers||[]],['driversList',r.data.drivers||[]]]){$(key).replaceChildren(...list.map(n=>{let o=document.createElement('option');o.value=String(n);return o}))}}catch(e){$('formMsg').textContent='نەشیایە لیستا ئەندازیار و شوڤێران بار بکەت: '+e.message}}
$('departure').addEventListener('submit',async e=>{e.preventDefault();let b=$('save');b.disabled=true;$('formMsg').textContent='چاڤەرێ بە...';let f=new FormData(e.target);try{let r=await api({action:'submit',data:Object.fromEntries(f.entries())});$('formMsg').textContent=r.message||'ب سەرکەفتیانە تۆمار بوو';$('formMsg').classList.add('ok');e.target.reset()}catch(err){$('formMsg').classList.remove('ok');$('formMsg').textContent=err.message+' — ئەگەر تۆمار بووبیت، دووبارە مەهنێرە تا د Google Sheets دا پشکنین بکەی.'}finally{b.disabled=false}});
$('loginForm').addEventListener('submit',async e=>{e.preventDefault();let b=$('load');b.disabled=true;$('dashMsg').textContent='چاڤەرێ بە...';try{let r=await api({action:'dashboard',password:$('password').value});allRows=r.data||[];$('password').value='';$('login').classList.add('hide');$('dataPanel').classList.remove('hide');$('dashMsg').textContent='';render()}catch(err){$('dashMsg').textContent=err.message}finally{b.disabled=false}});
function render(){let fEng=$('engFilter').value.toLowerCase(),fDrv=$('driverFilter').value.toLowerCase(),m=$('monthFilter').value,d=$('dateFilter').value;let data=allRows.filter(r=>String(r[2]||'').toLowerCase().includes(fEng)&&String(r[4]||'').toLowerCase().includes(fDrv)&&(!m||String(r[0]).startsWith(m))&&(!d||String(r[0])===d));$('rows').replaceChildren(...data.map(r=>{let tr=document.createElement('tr');for(let i=0;i<6;i++){let td=document.createElement('td');td.textContent=String(r[i]??'');tr.appendChild(td)}return tr}));let counts={};data.forEach(r=>{let k=String(r[4]||'');if(k)counts[k]=(counts[k]||0)+1});$('stats').textContent='کۆی دەرکەفتنان: '+data.length+' | '+Object.entries(counts).map(([k,v])=>k+': '+v+' جار').join(' • ')}
['engFilter','driverFilter','monthFilter','dateFilter'].forEach(id=>$(id).addEventListener('input',render));function resetFilters(){['engFilter','driverFilter','monthFilter','dateFilter'].forEach(id=>$(id).value='');render()}window.addEventListener('ziata-ready',metadata,{once:true});
</script><script src="ziata-shell.js?v=31"></script><script>window.addEventListener("ziata-ready",()=>document.body.style.visibility="visible")</script><script src="/ZIATA/pwa-register.js" defer></script></body></html>
