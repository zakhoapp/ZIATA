<!doctype html><html lang="ku" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ZIATA | ئاگەهداریێن سکرتێری</title><link rel="stylesheet" href="ziata-auth.css"><link rel="stylesheet" href="ziata-v34.css"><link rel="stylesheet" href="ziata-design.css"><link rel="stylesheet" href="ziata-v58.css"><style>body{background:#f4f7fb}main{max-width:850px;margin:30px auto;padding:18px}.zi-push-admin{background:white;padding:25px;border:1px solid #dce5ee;border-radius:16px}label{display:block;margin:12px 0}input,textarea,select{width:100%;box-sizing:border-box;padding:12px;border:1px solid #d4dfeb;border-radius:10px;font:inherit}button{padding:12px 20px;border:0;background:#14355c;color:white;border-radius:10px;font:inherit;cursor:pointer}#zi-v58-users label{display:block;padding:7px}#zi-v58-users input{width:auto}#zi-v58-picker[hidden]{display:none}#secretary-denied{color:#a22}</style></head><body><main><h1>🔔 فرێکرنا ئاگەهداریان</h1><p>سیستەمێ سکرتێری · ZIATA</p><p id="secretary-denied" role="alert"></p><section class="zi-push-admin" id="secretary-panel" hidden><h2>ئاگەهداریەکا نوی</h2><form id="zi-v58-form"><label>سەردێڕ<input id="zi-v58-title" maxlength="90" required></label><label>پەیاما ئاگەهداریێ<textarea id="zi-v58-body" maxlength="5000" rows="6" required></textarea></label><label>وەرگر<select id="zi-v58-scope"><option value="all">هەمی فەرمانبەرێن چالاک</option><option value="selected">فەرمانبەرێن دەستنیشانکری</option></select></label><div id="zi-v58-picker" hidden><input id="zi-v58-search" placeholder="گەڕیان ب ناڤی"><div id="zi-v58-users"></div><small id="zi-v58-selected-count">0 هەلبژارتی</small></div><button type="submit">فرێکرنا ئاگەهداریێ</button></form><p id="zi-v58-result" role="status"></p></section><p><a href="index.html">ڤەگەڕیان بۆ داشبۆردێ</a></p></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><script src="ziata-supabase-config.js"></script><script src="ziata-shell.js"></script><script src="ziata-auth.js?v=89"></script><script>window.addEventListener('ziata-ready',async e=>{const c=e.detail;if(c.profile?.is_admin){document.getElementById('secretary-panel').hidden=false;return}const r=await ziataSB.from('ziata_notification_senders').select('user_id').eq('user_id',c.session.user.id).maybeSingle();if(!r.error&&r.data){document.getElementById('secretary-panel').hidden=false}else document.getElementById('secretary-denied').textContent='دەستهەلاتا فرێکرنا ئاگەهداریان بۆ ئەڤی حسابی نەهاتیە دانان.'});</script><script src="ziata-v58-admin.js?v=58"></script></body></html>
