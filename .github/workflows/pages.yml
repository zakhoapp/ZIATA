name: Deploy ZIATA to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check Pillow
      - name: Correct existing PWA icon white padding
        run: python tools/fix_pwa_icons.py
      - name: Commit corrected app icons
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add icons/icon-192.png icons/icon-512.png icons/icon-maskable-512.png
          if ! git diff --cached --quiet; then
            git commit -m "Fix white padding in ZIATA PWA icons [skip ci]"
            git push origin HEAD:main
          fi
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload static files
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
